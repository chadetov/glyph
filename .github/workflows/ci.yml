name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: the workflow-level token can only read.
# Jobs that need more (Pages, provenance, npm publish) ask for it themselves.
permissions: read-all

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Publish discipline: the workspace Cargo version, the six npm
      # package.json versions, and the launcher's optionalDependencies pins must
      # all agree, or a release ships half-bumped. Also flags (non-fatally) when
      # the published npm `latest` has fallen behind the repo.
      - name: Check version consistency
        run: python3 scripts/check_versions.py

      # Backlog discipline: a release that closes a dogfooding gap has to mark it
      # and update the count, or the gap list drifts out of sync with the
      # compiler and has to be reconciled by hand again.
      - name: Check the dogfooding gap list
        run: |
          python3 scripts/check_gaps.py
          python3 scripts/check_findings_scheduled.py
          python3 scripts/check_plans_fresh.py

      # The claim discipline: an app that needs a hand-written `.d.ts` or an
      # `extern_ts` string needs the language Glyph replaces. When one does, the
      # answer is to extend the stdlib, not to add a declaration file.
      - name: Check the apps are written in Glyph alone
        run: python3 scripts/check_apps_are_glyph.py

      # The launcher's tests used to run only in the release workflow, after the
      # tag was pushed, so a broken launcher merged clean and was first executed
      # on the way to the registry.
      - name: Check the npm launcher resolves
        run: node --test npm/scripts/resolve.test.mjs

  test:
    name: Test + type-check examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Rust toolchain is pinned by rust-toolchain.toml; rustup installs it
      # on the first cargo invocation. Cache the registry + build dir to keep CI
      # fast.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            glyph-compiler/target
          key: cargo-${{ runner.os }}-${{ hashFiles('glyph-compiler/Cargo.lock') }}

      # node + tsx + tsc let the toolchain-dependent tests (glyph run, @example /
      # @doc @run execution) and the `--check` step actually run rather than skip.
      # typescript is pinned to 6.x to keep `tsc --strict` on the classic checker
      # for the examples type-check. `glyph gen dts` supports both the classic
      # (5/6) and 7.x native compilers, so its test exercises the classic path
      # here; the native path is covered separately.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Pinned exactly. A range here means two runs of the same commit can
      # install different compilers, so a green build stops being evidence
      # about the code. Bump deliberately, not by drift.
      - run: npm install -g tsx@4.23.13 typescript@6.0.3
      # The gen-dts helper resolves `typescript` with `require`, from the target
      # project first and then via NODE_PATH. A global install is only on that
      # second path, so without this the helper cannot load it, writes nothing,
      # and the test that was meant to exercise the classic compiler fails
      # instead of running.
      - run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      # Lints before tests: a clippy finding is usually cheaper to read than a
      # test failure, and this is a compiler, so the lints that matter are the
      # ones about correctness rather than style. Turning this on found a test
      # that never ran (no `#[test]`), another registered twice, and two doc
      # comments detached from the functions they documented.
      - name: Clippy
        working-directory: glyph-compiler
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace tests
        working-directory: glyph-compiler
        # Tee'd because the next step reads the real test count out of the log
        # rather than trusting a number someone typed into a markdown file.
        run: |
          set -o pipefail
          # tee opens the file before cargo creates target/, so on a cold cache
          # the redirect fails before a single test runs.
          mkdir -p target
          cargo test --workspace --locked 2>&1 | tee target/suite.log
          # The marker says the run finished. Without it the next step cannot
          # tell a complete log from a partial one, and summing a prefix
          # reports a test count that was never measured.
          echo "EXIT=$?" >> target/suite.log

      - name: Check doc claims against the suite
        run: python3 scripts/check_doc_claims.py

      - name: Type-check the examples with tsc --strict
        working-directory: glyph-compiler
        # `glyph build` type-checks with tsc and runs every `@example` / `@doc
        # @run` by default; --no-tsc and --no-test would skip them.
        #
        # One invocation covers the whole tree. Each app under
        # examples/apps/<name>/ carries a `package.json` with a `"glyph"` key, so
        # it is its own module-resolution root (D41) and its bare-name imports
        # resolve the same way here as they do when the app is built on its own.
        #
        # An app may depend on real npm packages: proving a working engineer can
        # use their existing dependencies is the 1.0 interop gate, and an app is
        # the only thing that has ever tested it. Its `node_modules` is not
        # committed, and the tree build has no way to skip a project, so anything
        # declaring dependencies is installed first. The loop is a no-op for the
        # apps that declare none, which today is all of them.
        run: |
          set -e
          cargo build -q
          BIN="$(pwd)/target/debug/glyph"
          for manifest in ../examples/apps/*/package.json; do
            app="$(dirname "$manifest")"
            if node -e "const p=JSON.parse(require('fs').readFileSync('$manifest','utf8')); process.exit(Object.keys(p.dependencies || {}).length ? 0 : 1)"; then
              echo "installing dependencies for $app"
              # `ci` rather than `install`: every app with dependencies has a
              # committed package-lock.json, so this resolves to the exact
              # integrity-hashed tree the lockfile names and fails loudly if
              # the manifest and the lock disagree.
              (cd "$app" && npm ci --no-audit --no-fund --loglevel=error)
            fi
          done
          "$BIN" build ../examples --out "$RUNNER_TEMP/dist"

      # The docs run against the compiler, not against a reader's memory. Both
      # of these need a built `glyph`, so they live here rather than in the
      # versions job.
      #
      # Prose rots in two directions. A snippet can stop compiling because the
      # language moved under it, and a snippet can look wrong while being
      # correct, which is how someone comes to "fix" working documentation.
      # `glyph init` drifting from the page that walks through it is the third
      # case, and compiling cannot catch it: the wrong first-run snippet
      # compiled fine for months.
      - name: Check the docs against the compiler
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: |
          set -e
          python3 scripts/check_scaffold_docs.py
          python3 scripts/check_docs_compile.py

      # The std/bytes codecs are hand-written, so the platform is not checking
      # them and the published RFC 4648 vectors only cover what someone thought
      # to write down. This runs them against node's Buffer over random data:
      # encoders must agree byte for byte, every encode must round-trip, and
      # anything a decoder accepts must re-encode to what it was given, which is
      # the property that catches a decoder gone lax. It exists because the
      # codecs were rewritten for speed once and could be again.
      - name: Check the bytes codecs against the platform
        run: npx --yes tsx@4.23.13 scripts/check_bytes_codecs.mjs

      # `docs/guide/external-imports.md` tells a user to install `@types/node`
      # for the full node surface, and the build then prefers it and skips the
      # bundled shim. That leaves every file under `runtime/std/` checked
      # against declarations nobody here wrote, and twice a bare `pub fn main`
      # has failed on a line of the compiler's own runtime because the shim
      # declared a node API more narrowly than node has it. A fixture cannot
      # catch that: the first guard built its stand-in by copying the shim and
      # passed against the very version that was failing. This installs the
      # real package at `latest`.
      # Also asks the narrower question the runtime build cannot: does every name
      # the shim exports actually exist in the real package? A name only user
      # code reaches never appears in the runtime build, which is how an invented
      # `Signals` export survived two review rounds.
      - name: Check the runtime against the real @types/node
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: python3 scripts/check_runtime_against_types_node.py

      # The evidence behind the four pillars, checked in both directions. The
      # TypeScript in each case has to keep passing `tsc --strict` or the case
      # proves nothing, and the Glyph has to keep failing with the code it names
      # or the guarantee it documents is gone.
      - name: Check what Glyph catches that tsc does not
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: python3 scripts/check_catches.py
