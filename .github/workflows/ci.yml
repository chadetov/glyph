name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: the workflow-level token can only read.
# Jobs that need more (Pages, provenance, npm publish) ask for it themselves.
permissions: read-all

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Publish discipline: the workspace Cargo version, the six npm
      # package.json versions, and the launcher's optionalDependencies pins must
      # all agree, or a release ships half-bumped. Also flags (non-fatally) when
      # the published npm `latest` has fallen behind the repo.
      - name: Check version consistency
        run: python3 scripts/check_versions.py

      # Backlog discipline: a release that closes a dogfooding gap has to mark it
      # and update the count, or the gap list drifts out of sync with the
      # compiler and has to be reconciled by hand again.
      - name: Check the dogfooding gap list
        run: |
          python3 scripts/check_gaps.py
          python3 scripts/check_findings_scheduled.py
          python3 scripts/check_plans_fresh.py

      # The claim discipline: an app that needs a hand-written `.d.ts` or an
      # `extern_ts` string needs the language Glyph replaces. When one does, the
      # answer is to extend the stdlib, not to add a declaration file.
      - name: Check the apps are written in Glyph alone
        run: python3 scripts/check_apps_are_glyph.py

      # The playground's wasm-bindgen version is pinned in one manifest and
      # repeated in the README and the deploy workflow. The two disagreed once,
      # and following the README produced exactly the mismatch the manifest's
      # own comment warned about.
      - name: Check the playground pin follows its manifest
        run: python3 scripts/check_playground_pin.py

      # The launcher's tests used to run only in the release workflow, after the
      # tag was pushed, so a broken launcher merged clean and was first executed
      # on the way to the registry.
      - name: Check the npm launcher resolves
        run: node --test npm/scripts/resolve.test.mjs

  test:
    name: Test + type-check examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Rust toolchain is pinned by rust-toolchain.toml; rustup installs it
      # on the first cargo invocation. The registry and the build dir are
      # cached so third-party crates are not recompiled on every run.
      #
      # The key is the toolchain hash plus the lockfile hash. A toolchain bump
      # makes every third-party artifact useless, so a cache from another
      # toolchain is never restored, not even as a fallback.
      #
      # Pushes to main restore only on an exact key match. When the key
      # changes, main builds from scratch and saves, so every saved cache is
      # one cold build of one toolchain and one lockfile, and what it holds
      # does not depend on the lockfiles it was restored through before.
      #
      # Pull requests also take `restore-keys`: the newest cache for the same
      # toolchain from any lockfile. Cargo rebuilds whatever the lockfile
      # changed and reuses the rest. Restoring cannot weaken a check:
      # `--locked` still holds, and the workspace crates rebuild on every run
      # because their artifacts are pruned before saving (and checkout gives
      # their sources fresh mtimes regardless). The expression is empty on a
      # push, and the action drops empty lines from `restore-keys`.
      #
      # Saved only from pushes to main by the last step of this job, and only
      # when this restore missed the exact key, so a pull request cannot write
      # a cache other runs read and an exact hit is not saved again.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            glyph-compiler/target
          key: cargo-${{ runner.os }}-${{ hashFiles('glyph-compiler/rust-toolchain.toml') }}-${{ hashFiles('glyph-compiler/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('cargo-{0}-{1}-', runner.os, hashFiles('glyph-compiler/rust-toolchain.toml')) || '' }}

      # node + tsx + tsc let the toolchain-dependent tests (glyph run, @example /
      # @doc @run execution) and the `--check` step actually run rather than skip.
      # typescript is pinned to 6.x to keep `tsc --strict` on the classic checker
      # for the examples type-check. `glyph gen dts` supports both the classic
      # (5/6) and 7.x native compilers, so its test exercises the classic path
      # here; the native path is covered separately.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Installed from a committed lockfile rather than `npm install -g`. A
      # global install resolves a version; a lockfile resolves an integrity
      # hash, so two runs of one commit get the same bytes rather than merely
      # the same version number.
      - run: npm ci --no-audit --no-fund
        working-directory: .github/ci-tools
      # `tsx` and `tsc` have to be runnable by name, and the gen-dts helper
      # resolves `typescript` with `require` from the target project first and
      # NODE_PATH second, so both paths point at the same locked tree.
      - run: |
          echo "$GITHUB_WORKSPACE/.github/ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$GITHUB_WORKSPACE/.github/ci-tools/node_modules" >> "$GITHUB_ENV"

      # The checker refuses a member read on an array or a string whose name is
      # not in its own list of their members (G288). The list was read out of
      # TypeScript, and this asks the pinned TypeScript again, so a release
      # that adds a method fails here rather than in somebody's build.
      - name: Check the array and string members follow TypeScript
        run: python3 scripts/check_builtin_members.py

      # Lints before tests: a clippy finding is usually cheaper to read than a
      # test failure, and this is a compiler, so the lints that matter are the
      # ones about correctness rather than style. Turning this on found a test
      # that never ran (no `#[test]`), another registered twice, and two doc
      # comments detached from the functions they documented.
      - name: Clippy
        working-directory: glyph-compiler
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace tests
        working-directory: glyph-compiler
        # Tee'd because the next step reads the real test count out of the log
        # rather than trusting a number someone typed into a markdown file.
        run: |
          set -o pipefail
          # tee opens the file before cargo creates target/, so on a cold cache
          # the redirect fails before a single test runs.
          mkdir -p target
          cargo test --workspace --locked 2>&1 | tee target/suite.log
          # The marker says the run finished. Without it the next step cannot
          # tell a complete log from a partial one, and summing a prefix
          # reports a test count that was never measured.
          echo "EXIT=$?" >> target/suite.log

      - name: Check doc claims against the suite
        run: python3 scripts/check_doc_claims.py

      - name: Type-check the examples with tsc --strict
        working-directory: glyph-compiler
        # `glyph build` type-checks with tsc and runs every `@example` / `@doc
        # @run` by default; --no-tsc and --no-test would skip them.
        #
        # One invocation covers the whole tree. Each app under
        # examples/apps/<name>/ carries a `package.json` with a `"glyph"` key, so
        # it is its own module-resolution root (D41) and its bare-name imports
        # resolve the same way here as they do when the app is built on its own.
        #
        # An app may depend on real npm packages: proving a working engineer can
        # use their existing dependencies is the 1.0 interop gate, and an app is
        # the only thing that has ever tested it. Its `node_modules` is not
        # committed, and the tree build has no way to skip a project, so anything
        # declaring dependencies is installed first. The loop is a no-op for the
        # apps that declare none, which today is all of them.
        run: |
          set -e
          cargo build -q
          BIN="$(pwd)/target/debug/glyph"
          for manifest in ../examples/apps/*/package.json; do
            app="$(dirname "$manifest")"
            if node -e "const p=JSON.parse(require('fs').readFileSync('$manifest','utf8')); process.exit(Object.keys(p.dependencies || {}).length ? 0 : 1)"; then
              echo "installing dependencies for $app"
              # `ci` rather than `install`: every app with dependencies has a
              # committed package-lock.json, so this resolves to the exact
              # integrity-hashed tree the lockfile names and fails loudly if
              # the manifest and the lock disagree.
              (cd "$app" && npm ci --no-audit --no-fund --loglevel=error)
            fi
          done
          "$BIN" build ../examples --out "$RUNNER_TEMP/dist"

      # The examples tree builds against a React stub, so the React example is
      # also checked against React's own declarations, from the todo app's
      # installed node_modules (G271). Runs after the step above installed it.
      - name: Check the React example against @types/react
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: python3 scripts/check_react_example.py

      # The todo app is what 0.1.128 is measured by, and type-checking it says
      # nothing about what renders: the release review found the committed app
      # showing "2left". This bundles it with Vite and drives it in headless
      # Chromium, asserting the text a user sees. Playwright is pinned by the
      # app's lockfile; the browser for that version is installed here.
      - name: Render the todo app in headless Chromium
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: |
          (cd examples/apps/todo && npx playwright install --with-deps chromium)
          python3 scripts/check_todo_renders.py

      # The `needs-npm` fences in the docs import pg, mongodb and zod. This
      # fixture exists only so they can be compiled against each package's
      # published types, and its committed lockfile pins the exact tree.
      - name: Install the packages the docs import
        working-directory: scripts/fixtures/docs-deps
        run: npm ci --no-audit --no-fund --loglevel=error

      # The docs run against the compiler, not against a reader's memory. Both
      # of these need a built `glyph`, so they live here rather than in the
      # versions job.
      #
      # Prose rots in two directions. A snippet can stop compiling because the
      # language moved under it, and a snippet can look wrong while being
      # correct, which is how someone comes to "fix" working documentation.
      # `glyph init` drifting from the page that walks through it is the third
      # case, and compiling cannot catch it: the wrong first-run snippet
      # compiled fine for months.
      #
      # A `needs-react` fence is compiled against React's own declarations from
      # the todo app's node_modules, which the examples type-check step above
      # installs, so this has to stay after it.
      #
      # A `needs-npm` fence is compiled the same way, against the packages the
      # step above installs.
      #
      # Fences are not the only code in AGENTS.md: a recipe written inline told
      # readers to import a `serve` std/http had stopped exporting, and nothing
      # compiled it. check_inline_imports resolves every inline std import.
      - name: Check the docs against the compiler
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: |
          set -e
          python3 scripts/check_scaffold_docs.py
          python3 scripts/check_docs_compile.py
          python3 scripts/check_inline_imports.py

      # The examples are the corpus the diff-stability pillar points at, and
      # for a long time 80 of them were not in the formatter's canonical form.
      # The benchmark fixtures are the programs the token counts are taken
      # over, and two of the three did not compile from the first measurement
      # on. Both facts stayed invisible because nothing looked.
      - name: Check the examples are formatted and the benchmark fixtures compile
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: |
          set -e
          python3 scripts/check_fmt.py
          python3 scripts/check_benchmark_fixtures.py

      # The std/bytes codecs are hand-written, so the platform is not checking
      # them and the published RFC 4648 vectors only cover what someone thought
      # to write down. This runs them against node's Buffer over random data:
      # encoders must agree byte for byte, every encode must round-trip, and
      # anything a decoder accepts must re-encode to what it was given, which is
      # the property that catches a decoder gone lax. It exists because the
      # codecs were rewritten for speed once and could be again.
      - name: Check the bytes codecs against the platform
        run: tsx scripts/check_bytes_codecs.mjs

      # `docs/guide/external-imports.md` tells a user to install `@types/node`
      # for the full node surface, and the build then prefers it and skips the
      # bundled shim. That leaves every file under `runtime/std/` checked
      # against declarations nobody here wrote, and twice a bare `pub fn main`
      # has failed on a line of the compiler's own runtime because the shim
      # declared a node API more narrowly than node has it. A fixture cannot
      # catch that: the first guard built its stand-in by copying the shim and
      # passed against the very version that was failing. This installs the
      # real package at `latest`.
      # Also asks the narrower question the runtime build cannot: does every name
      # the shim exports actually exist in the real package? A name only user
      # code reaches never appears in the runtime build, which is how an invented
      # `Signals` export survived two review rounds.
      - name: Check the runtime against the real @types/node
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: python3 scripts/check_runtime_against_types_node.py

      # The checker types a stdlib call from its own table, and the function
      # that runs is the TypeScript under runtime/std/. Nothing else compares
      # them. For every row `glyph llms --json` calls complete, this binds the
      # runtime export to the declared type and back under the pinned tsc, and
      # fails on any mismatch the gap ledger does not already record.
      - name: Check the stdlib signatures against the runtime
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: python3 scripts/check_stdlib_signatures.py

      # The evidence behind the four pillars, checked in both directions. The
      # TypeScript in each case has to keep passing `tsc --strict` or the case
      # proves nothing, and the Glyph has to keep failing with the code it names
      # or the guarantee it documents is gone.
      - name: Check what Glyph catches that tsc does not
        env:
          GLYPH_BIN: ${{ github.workspace }}/glyph-compiler/target/debug/glyph
        run: python3 scripts/check_catches.py

      # Skipped on an exact cache hit, with the save below: the restored cache
      # already is this key's cold build, so there is nothing new to save.
      #
      # Last in the job because pruning deletes the `glyph` binary every step
      # above uses. Only the third-party build is worth keeping: the workspace
      # crates rebuild on every run anyway, and `incremental/` only grows. Left
      # in, both would make the cache larger with each save and buy nothing.
      # The crate list comes from `cargo metadata`, so a new workspace member
      # is pruned without anyone editing this step.
      - name: Prune the workspace's own build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        working-directory: glyph-compiler
        run: |
          set -euo pipefail
          du -sh target || true
          pkgs=()
          for name in $(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[].name'); do
            pkgs+=(-p "$name")
          done
          cargo clean --locked "${pkgs[@]}"
          rm -rf target/debug/incremental target/suite.log
          du -sh target || true

      - name: Save the cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            glyph-compiler/target
          key: cargo-${{ runner.os }}-${{ hashFiles('glyph-compiler/rust-toolchain.toml') }}-${{ hashFiles('glyph-compiler/Cargo.lock') }}
