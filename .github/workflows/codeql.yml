name: CodeQL

# Static analysis over the three things this repo actually ships: the Rust
# compiler, the TypeScript runtime and site scripts, and the workflows
# themselves. Findings land in the repository's code-scanning tab.
#
# This is the check `cargo clippy` does not do. Clippy reads one crate at a
# time and mostly asks whether code is idiomatic; CodeQL follows data across
# functions and files and asks where untrusted input reaches something that
# matters. On a compiler the interesting answer is usually about the paths that
# read a source file or shell out to `tsc`.

on:
  push:
    branches: [main]
  # Also on pull requests, so the analysis runs on a change *before* it lands.
  # Without this the scan only ever sees `main`, which OpenSSF Scorecard reports
  # as "0 commits out of 3 are checked with a SAST tool": the tool is configured
  # and the commits went past it unscanned. It costs about two minutes and runs
  # beside the other checks rather than after them.
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

permissions: read-all

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
