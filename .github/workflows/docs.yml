name: Site checks

# Guard the site against broken internal links, malformed HTML, answers
# sub-nav drift, and a web/ that is not what site/ renders. Runs when the site,
# its source, its checkers, or the npm README changes.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "site/**"
      - "playground/**"
      - "scripts/check_site.py"
      - "scripts/build_site.py"
      - "scripts/check_site_built.py"
      - "scripts/site_versions.py"
      - "scripts/site_i18n.py"
      - "scripts/site_jsonld.py"
      - "scripts/site_markdown.py"
      - "scripts/check_i18n.py"
      - "scripts/check_releases.py"
      - "glyph-compiler/Cargo.toml"
      - "npm/glyph/README.md"
      - ".github/workflows/docs.yml"
  # No `paths` filter on pull requests, deliberately. This job is a required
  # check, and a required check that only runs for some paths never reports on
  # the others, so those pull requests wait for it forever. It costs a couple of
  # seconds, which is cheaper than the deadlock.
  pull_request:

# Least privilege by default: the workflow-level token can only read.
# Jobs that need more (Pages, provenance, npm publish) ask for it themselves.
permissions: read-all

jobs:
  site:
    name: Links, HTML, and sub-nav
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the site (links resolve, HTML well-formed, sub-nav consistent)
        run: python3 scripts/check_site.py
      - name: Check web/ is what site/ renders (edit site/, then run scripts/build_site.py)
        run: python3 scripts/check_site_built.py
      - name: Check the translations (structure, code blocks, wording; reports stale ones without failing)
        run: python3 scripts/check_i18n.py
      - name: Check every released version has notes in site/releases/
        run: python3 scripts/check_releases.py
      - name: Confirm the npm package still ships a README
        working-directory: npm/glyph
        run: |
          npm pack --dry-run 2>&1 | grep -q "README.md" \
            || { echo "npm/glyph package is missing README.md"; exit 1; }
