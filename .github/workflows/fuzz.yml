name: Fuzz

# Scheduled rather than per-PR. A fuzzer that gates a pull request either runs
# too briefly to find anything or blocks the pull request, and neither is worth
# having. This runs nightly and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [parse, lex, format_idempotent]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # `rustup default nightly` is not enough: rust-toolchain.toml pins 1.95
      # and a toolchain file wins over the default, so every cargo call below
      # names the toolchain explicitly with `+nightly`.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked --version 0.13.2

      - name: Fuzz ${{ matrix.target }}
        working-directory: glyph-compiler
        env:
          MINUTES: ${{ github.event.inputs.minutes || '10' }}
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds -- \
            -max_total_time=$(( MINUTES * 60 )) \
            -max_len=8192

      # A crash is only useful if the input survives the job that found it.
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: glyph-compiler/fuzz/artifacts/
          if-no-files-found: ignore
