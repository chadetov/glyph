ts_result = "<b>Archiving an item logs nothing.</b> Nothing says the <code>switch</code> is out of date."
glyph_result = "<b>The build stops and names the case.</b>"
page_note = "TypeScript checks that a <code>switch</code> covers every case only when the function returns a value from every branch, or with the <code>assertNever</code> idiom. A handler that returns nothing gets neither. In Glyph every <code>match</code> must cover every case, so adding a variant lists each place that has to change."
