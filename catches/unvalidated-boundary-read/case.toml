code = "E0204"
pillar = "verifiability"
title = "A parsed body assigned to a typed name without being checked"
note = "`json.parse` returns a `Result<unknown, Array<Issue>>`, and Glyph's own checker refuses it where a `User` is declared, so `glyph check --no-tsc` fails on it too. In TypeScript `JSON.parse` returns `any`, and the annotation launders it. `json.parse<User>(body)` validates the body and hands back a `Result` to match on."
kind = "refused"
ts_output = "undefined"
fullconfig = "lint:no-unsafe-assignment"
section = "mistake"
slug = "unvalidated-boundary-read"
order = 36
page_title = "A parsed body given a type without a check"
why = "Reading a request body into a typed variable."
likelihood = 4
severity = 4
ts_verdict = "compiles, runs"
glyph_verdict = "refused when you build"
ts_result = "<b>The annotation is a promise nothing keeps.</b> <code>JSON.parse</code> returns <code>any</code>, so a body of any shape gets through."
glyph_result = "<b><code>json.parse</code> returns a <code>Result</code> of <code>unknown</code>,</b> and that is not a <code>User</code>."
page_note = "Writing <code>const user: User</code> looks like a check and is not one. In Glyph, <code>json.parse&lt;User&gt;(body)</code> checks the body and returns a <code>Result</code> to match on."
