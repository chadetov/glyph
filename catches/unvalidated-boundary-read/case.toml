code = "E0204"
pillar = "verifiability"
title = "A parsed body assigned to a typed name without being checked"
note = "`json.parse` returns a `Result<unknown, Array<Issue>>`, and Glyph's own checker refuses it where a `User` is declared, so `glyph check --no-tsc` fails on it too. In TypeScript `JSON.parse` returns `any`, and the annotation launders it. `json.parse<User>(body)` validates the body and hands back a `Result` to match on."
