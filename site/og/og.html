<!doctype html>
<!-- The link-preview image, /og.png. scripts/site_images.py renders this page
     at 1200x630 with headless Chrome and writes site/static/og.png. Colours and
     type are the site's: the navy band, IBM Plex Sans, the cyan accent. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 400;
        src: url("../static/fonts/IBMPlexSans-Regular-Latin1.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 700;
        src: url("../static/fonts/IBMPlexSans-Bold-Latin1.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 500;
        src: url("../static/fonts/IBMPlexMono-Medium-Latin1.woff2") format("woff2");
      }
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0d1424;
      }
      body {
        box-sizing: border-box;
        padding: 72px 88px 64px;
        display: flex;
        flex-direction: column;
        color: #ffffff;
        font-family: "IBM Plex Sans", sans-serif;
        background:
          radial-gradient(900px 520px at 100% 0%, rgba(124, 92, 255, 0.22), transparent 60%),
          radial-gradient(700px 420px at 0% 100%, rgba(63, 208, 201, 0.10), transparent 60%),
          #0d1424;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 64px 0 0;
        font-size: 76px;
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      h1 span {
        display: block;
        color: #3fd0c9;
      }
      .sub {
        margin: 32px 0 0;
        font: 500 30px/1.3 "IBM Plex Mono", monospace;
        color: #b9c2d6;
      }
      .foot {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 28px;
        color: #b9c2d6;
      }
      .foot .url {
        color: #ffffff;
        font-weight: 700;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: linear-gradient(90deg, #7c5cff, #3fd0c9);
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 6 L58 32 L32 58 L6 32 Z" fill="none" stroke="#7c5cff" stroke-width="6" stroke-linejoin="round" />
        <path d="M32 22 L42 32 L32 42 L22 32 Z" fill="#3fd0c9" />
      </svg>
      Glyph
    </div>
    <h1>Your AI agent writes it. <span>The compiler checks it.</span></h1>
    <p class="sub">compiles to TypeScript</p>
    <div class="foot"><span class="url">glyphlang.io</span></div>
    <div class="bar"></div>
  </body>
</html>
