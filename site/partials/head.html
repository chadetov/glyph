    <script>
      (function () {
        document.documentElement.classList.add("js");
        try {
          var t = localStorage.getItem("glyph-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
