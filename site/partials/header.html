    <script>
      (function () {
        var root = document.documentElement;
        var header = document.querySelector(".site-header");
        if (!header) return;
        var menus = [].slice.call(header.querySelectorAll("details.nav-menu"));
        var burger = header.querySelector(".nav-burger");
        var phone = window.matchMedia("(max-width: 860px)");
        var hover = window.matchMedia("(hover: hover) and (pointer: fine)");
        function summary(d) {
          return d.querySelector("summary");
        }
        function anyOpen() {
          return menus.some(function (d) {
            return d.open;
          });
        }
        function closeMenus(except) {
          menus.forEach(function (d) {
            if (d !== except) d.open = false;
          });
        }
        // A pointer press hides the focus ring; the next key brings it back.
        document.addEventListener("pointerdown", function () {
          root.classList.add("nav-pointer");
        });
        document.addEventListener("keydown", function () {
          root.classList.remove("nav-pointer");
        });
        menus.forEach(function (d) {
          var s = summary(d);
          var timer = null;
          s.setAttribute("aria-expanded", "false");
          d.addEventListener("toggle", function () {
            s.setAttribute("aria-expanded", d.open ? "true" : "false");
            if (phone.matches) return;
            if (d.open) {
              closeMenus(d);
              var drop = d.querySelector(".nav-drop");
              drop.style.transform = "";
              var r = drop.getBoundingClientRect();
              var over = r.right - (window.innerWidth - 8);
              var under = 8 - r.left;
              if (over > 0) drop.style.transform = "translateX(" + -over + "px)";
              else if (under > 0) drop.style.transform = "translateX(" + under + "px)";
            } else {
              delete d.dataset.hover;
            }
            root.classList.toggle("nav-dim", anyOpen());
          });
          s.addEventListener("click", function (e) {
            // On a phone the groups are always-open sections of the panel.
            if (phone.matches) return e.preventDefault();
            // A click on a panel that hover just opened keeps it open.
            if (d.open && d.dataset.hover) {
              e.preventDefault();
              delete d.dataset.hover;
            }
          });
          // Hover intent: open after a short rest, close after a short leave.
          var li = d.parentNode;
          li.addEventListener("pointerenter", function (e) {
            if (phone.matches || !hover.matches || e.pointerType !== "mouse") return;
            clearTimeout(timer);
            timer = setTimeout(function () {
              if (!d.open) {
                d.dataset.hover = "1";
                d.open = true;
              }
            }, anyOpen() ? 0 : 120);
          });
          li.addEventListener("pointerleave", function (e) {
            if (phone.matches || !hover.matches || e.pointerType !== "mouse") return;
            clearTimeout(timer);
            timer = setTimeout(function () {
              if (d.dataset.hover) d.open = false;
            }, 220);
          });
          d.addEventListener("keydown", function (e) {
            if (phone.matches || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
            var links = [].slice.call(d.querySelectorAll(".nav-drop a"));
            e.preventDefault();
            d.open = true;
            var i = links.indexOf(document.activeElement);
            if (e.key === "ArrowDown") i = (i + 1) % links.length;
            else i = i <= 0 ? links.length - 1 : i - 1;
            links[i].focus();
          });
        });
        function setPanel(open) {
          // Measure the header before locking the page: the lock must not move
          // it, and the panel never starts above the top of the screen.
          if (open) root.style.setProperty("--nav-h", Math.max(0, header.getBoundingClientRect().bottom) + "px");
          header.classList.toggle("nav-open", open);
          root.classList.toggle("nav-locked", open);
          burger.setAttribute("aria-expanded", open ? "true" : "false");
          burger.setAttribute("aria-label", open ? {{tj:nav.close}} : {{tj:nav.open}});
        }
        burger.addEventListener("click", function () {
          setPanel(!header.classList.contains("nav-open"));
        });
        document.addEventListener("click", function (e) {
          if (phone.matches) return;
          menus.forEach(function (d) {
            if (d.open && !d.contains(e.target)) d.open = false;
          });
        });
        document.addEventListener("focusin", function (e) {
          if (phone.matches) return;
          menus.forEach(function (d) {
            if (d.open && !d.contains(e.target)) d.open = false;
          });
        });
        document.addEventListener("keydown", function (e) {
          if (e.key !== "Escape") return;
          if (phone.matches) {
            if (header.classList.contains("nav-open")) {
              setPanel(false);
              burger.focus();
            }
            return;
          }
          var open = menus.filter(function (d) {
            return d.open;
          });
          if (!open.length) return;
          closeMenus();
          summary(open[0]).focus();
        });
        // Leaving the page (a link inside a panel, back/forward) closes everything.
        window.addEventListener("pagehide", function () {
          closeMenus();
          setPanel(false);
        });
        function layout() {
          menus.forEach(function (d) {
            d.open = phone.matches;
            if (phone.matches) summary(d).setAttribute("tabindex", "-1");
            else summary(d).removeAttribute("tabindex");
          });
          if (!phone.matches) setPanel(false);
          root.classList.remove("nav-dim");
        }
        if (phone.addEventListener) phone.addEventListener("change", layout);
        else phone.addListener(layout);
        layout();
      })();
    </script>
    <script>
      // A code block wider than its box says so: site/style.css fades the
      // edge it can scroll toward. A block in a closed <details> has no width
      // until it opens, so each one is re-measured whenever its size changes.
      document.addEventListener("DOMContentLoaded", function () {
        if (!window.ResizeObserver) return;
        function edges(p) {
          var scrolls = p.scrollWidth > p.clientWidth + 1;
          p.classList.toggle("scrolls", scrolls);
          p.classList.toggle("at-start", scrolls && p.scrollLeft < 2);
          p.classList.toggle("at-end", scrolls && p.scrollLeft + p.clientWidth >= p.scrollWidth - 2);
        }
        var seen = new ResizeObserver(function (entries) {
          entries.forEach(function (e) {
            edges(e.target);
          });
        });
        var pres = [].slice.call(document.querySelectorAll("pre"));
        pres.forEach(function (p) {
          seen.observe(p);
          p.addEventListener("scroll", function () {
            edges(p);
          }, { passive: true });
        });
        // the web font changes how wide a line is without resizing the box
        if (document.fonts) document.fonts.ready.then(function () {
          pres.forEach(edges);
        });
      });
    </script>
    <script>
      // The answers list: a sidebar on wide screens needs nothing, and on
      // narrow ones the bar's button opens the same list as a panel.
      document.addEventListener("DOMContentLoaded", function () {
        var root = document.documentElement;
        var btn = document.querySelector(".ans-all");
        var side = document.getElementById("ans-nav");
        if (!btn || !side) return;
        var bar = document.querySelector(".ans-bar");
        var close = side.querySelector(".ans-close");
        function set(open, fromKey) {
          if (open) root.style.setProperty("--ans-top", Math.max(0, bar.getBoundingClientRect().bottom) + "px");
          root.classList.toggle("ans-open", open);
          root.classList.toggle("nav-dim", open);
          btn.setAttribute("aria-expanded", open ? "true" : "false");
          if (open && fromKey) {
            var cur = side.querySelector('[aria-current="page"]');
            if (cur) cur.focus();
          }
        }
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          // a click from the keyboard (detail 0) moves focus into the list
          set(!root.classList.contains("ans-open"), e.detail === 0);
        });
        close.addEventListener("click", function () {
          set(false);
          btn.focus();
        });
        document.addEventListener("click", function (e) {
          if (root.classList.contains("ans-open") && !side.contains(e.target)) set(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && root.classList.contains("ans-open")) {
            set(false);
            btn.focus();
          }
        });
        window.addEventListener("resize", function () {
          if (root.classList.contains("ans-open") && window.innerWidth >= 1240) set(false);
        });
      });
    </script>
